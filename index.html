<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - Ecommerce Website</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <!-- Navbar -->
    <header>
        <nav class="navbar">
            <div class="logo">
                <h2>ShopEasy</h2>
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="wishlist.html">Wishlist</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="orders.html">Orders</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                
                <li id="loginLink">
                    <a href="login.html">Login</a>
                </li>
                
                <li id="registerLink">
                    <a href="register.html">Register</a>
                </li>
                
                <li id="userName" style="display:none;"></li>
                
                <li id="logoutLink" style="display:none;">
                    <a href="#" onclick="logout()">Logout</a>
                </li>
            </ul>

            <a href="cart.html" class="cart">
                <i class="fas fa-shopping-cart"></i>
                <span id="cart-count">0</span>
            </a>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Discover Amazing Products</h1>
            <p>Quality products at affordable prices.</p>
            <a href="#products" class="btn">Shop Now</a>
        </div>
    </section>

    <!-- Products -->
    <section class="products" id="products">
        <h2>Featured Products</h2>

        <div class="product-container" id="product-container">

            <!-- Products will be added using JavaScript -->

        </div>

    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 ShopEasy. All Rights Reserved.</p>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
