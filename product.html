<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Details | ShopEasy</title>

<link rel="stylesheet" href="css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header>

<nav class="navbar">

<div class="logo">
<h2>🛒 ShopEasy</h2>
</div>

<ul class="nav-links">

<li><a href="index.html">Home</a></li>

<li><a href="products.html">Products</a></li>

<li><a href="wishlist.html">Wishlist</a></li>

<li><a href="cart.html">Cart</a></li>

</ul>

<a href="cart.html" class="cart">

<i class="fas fa-shopping-cart"></i>

<span id="cart-count">0</span>

</a>

</nav>

</header>

<section class="product-details">

<div class="product-image">

<img id="product-image" src="" alt="">

</div>

<div class="product-content">

<span id="product-category" class="category"></span>

<h1 id="product-name"></h1>

<div id="product-rating" class="rating"></div>

<div class="price-box">

<h2 id="product-price"></h2>

<p id="old-price" class="old-price"></p>

<span id="discount" class="discount"></span>

</div>

<p id="product-description"></p>

<p class="stock">
✔ <span id="stock"></span>
</p>

<p class="delivery">
🚚 Free Delivery
</p>

<p class="seller">
🏪 Seller: ShopEasy Official
</p>

<div class="detail-buttons">

<button id="cartBtn" class="add-cart">
<i class="fas fa-shopping-cart"></i>
Add to Cart
</button>

<button id="wishBtn" class="wishlist-btn">
<i class="fas fa-heart"></i>
</button>

</div>

</div>

</section>

<section class="specifications">

<h2>Specifications</h2>

<table id="spec-table">

</table>

</section>

<footer>

<p>© 2026 ShopEasy. All Rights Reserved.</p>

</footer>

<script src="js/products.js"></script>
<script src="js/script.js"></script>
<script src="js/product.js"></script>

</body>
</html>
